<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Question</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --card: rgba(0,0,0,0.04);
      --shadow: 0 20px 60px rgba(0,0,0,0.10);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    .wrap {
      width: min(520px, 92vw);
      padding: 22px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 22px;
      position: relative;
      overflow: hidden;
    }
    .step {
      display: none;
      animation: fadeUp 450ms ease forwards;
    }
    .step.active { display: block; }
    h1 {
      margin: 0 0 10px 0;
      font-size: clamp(28px, 4vw, 34px);
      letter-spacing: -0.02em;
      line-height: 1.12;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: 1px solid rgba(0,0,0,0.12);
      background: white;
      color: var(--text);
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    button.primary {
      border-color: rgba(0,0,0,0.18);
    }
    .hint {
      margin-top: 14px;
      font-size: 13px;
      color: rgba(0,0,0,0.45);
    }
    .center {
      text-align: center;
    }
    .big {
      font-size: clamp(30px, 4.4vw, 40px);
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin-bottom: 12px;
    }
    .heart {
      display: inline-block;
      transform: translateY(1px);
    }
    canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 250ms ease;
    }
    canvas.on { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <canvas id="confetti"></canvas>

      <!-- Step 1 -->
      <div class="step active" id="s1">
        <h1>Quick question.</h1>
<p>I didn’t want to ask this over text.</p>
        <div class="actions">
          <button class="primary" onclick="next()">Continue</button>
        </div>
        <div class="hint">tap “Continue”</div>
      </div>

      <!-- Step 2 -->
      <div class="step" id="s2">
        <h1>So I made this instead.</h1>
        <p>Because this felt more… right.</p>
        <div class="actions">
          <button class="primary" onclick="next()">Okay</button>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="step center" id="s3">
        <div class="big">Will you be my Valentine? <span class="heart">❤️</span></div>
        <p>No pressure. But also… yes.</p>
        <div class="actions" style="justify-content:center">
          <button class="primary" onclick="yes()">Yes</button>
          <button onclick="yes()">Obviously yes</button>
        </div>
      </div>

      <!-- Step 4 -->
      <div class="step center" id="s4">
        <div class="big">Good.</div>
        <p style="font-size:17px; color: rgba(0,0,0,0.65); margin-bottom: 10px;">
          Because I already got you flowers.
        </p>
        <p>(turn around.)</p>
      </div>

    </div>
  </div>

  <script>
    const steps = ["s1","s2","s3","s4"];
    let idx = 0;

    function show(i){
      steps.forEach((id, n) => {
        document.getElementById(id).classList.toggle("active", n === i);
      });
      idx = i;
    }

    function next(){
      const n = Math.min(idx + 1, steps.length - 1);
      show(n);
    }

    // --- confetti (tiny + lightweight) ---
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let pieces = [];
    let raf = null;

    function resize(){
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);

    function burst(){
      resize();
      pieces = Array.from({length: 140}, () => ({
        x: canvas.parentElement.clientWidth / 2,
        y: canvas.parentElement.clientHeight * 0.28,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 1.2) * 12,
        g: 0.35 + Math.random()*0.15,
        r: 3 + Math.random()*3,
        a: 1,
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.2
      }));
      canvas.classList.add("on");
      if (raf) cancelAnimationFrame(raf);
      tick();
      setTimeout(() => canvas.classList.remove("on"), 1400);
    }

    function tick(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const w = canvas.parentElement.clientWidth;
      const h = canvas.parentElement.clientHeight;

      pieces.forEach(p => {
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.a *= 0.985;

        ctx.save();
        ctx.globalAlpha = p.a;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        // random light grayscale pieces (no loud colors)
        const shade = 30 + Math.floor(Math.random()*40);
        ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
        ctx.fillRect(-p.r, -p.r, p.r*2, p.r*2);
        ctx.restore();
      });

      pieces = pieces.filter(p => p.a > 0.08 && p.y < h + 40 && p.x > -40 && p.x < w + 40);
      if (pieces.length) raf = requestAnimationFrame(tick);
    }

    function yes(){
      burst();
      show(3);
    }
  </script>
</body>
</html>
